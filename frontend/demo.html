<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EliteHub Inventory Monitor</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
      /* Custom animations */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }

      /* Scrollbar styling */
      .overflow-y-auto::-webkit-scrollbar {
        width: 6px;
      }
      .overflow-y-auto::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
      }
      .overflow-y-auto::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
      }
      .overflow-y-auto::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Batch Import Monitor Component
      const BatchImportMonitor = ({ token, onImportComplete }) => {
          // Socket and connection state
          const [socket, setSocket] = useState(null);
          const [isConnected, setIsConnected] = useState(false);
          const [connectionError, setConnectionError] = useState(null);

          // Import session state
          const [currentSession, setCurrentSession] = useState(null);
          const [isMonitoring, setIsMonitoring] = useState(false);

          // Progress state
          const [progress, setProgress] = useState({
              status: 'idle',
              currentPhase: '',
              progress: 0,
              processedCount: 0,
              successCount: 0,
              errorCount: 0,
              skipCount: 0,
              itemCount: 0,
              estimatedTimeRemaining: null,
              errors: [],
              warnings: [],
              results: null
          });

          // File upload state
          const [selectedFile, setSelectedFile] = useState(null);
          const [isUploading, setIsUploading] = useState(false);
          const [uploadProgress, setUploadProgress] = useState(0);
          const fileInputRef = useRef(null);

          // Initialize Socket.io connection
          useEffect(() => {
              if (!token) return;

              const newSocket = io('http://localhost:3000', {
                  auth: { token },
                  transports: ['websocket', 'polling'],
                  timeout: 10000,
                  reconnection: true,
                  reconnectionAttempts: 5,
                  reconnectionDelay: 1000
              });

              // Connection event handlers
              newSocket.on('connect', () => {
                  console.log('✅ Connected to Socket.io');
                  setIsConnected(true);
                  setConnectionError(null);
              });

              newSocket.on('disconnect', (reason) => {
                  console.log('🔌 Disconnected:', reason);
                  setIsConnected(false);
              });

              newSocket.on('connect_error', (error) => {
                  console.error('❌ Connection error:', error);
                  setConnectionError(error.message);
                  setIsConnected(false);
              });

              // Import monitoring event handlers
              newSocket.on('import_progress', (data) => {
                  console.log('📊 Progress update:', data);
                  setProgress(prev => ({
                      ...prev,
                      ...data,
                      errors: data.errors || [],
                      warnings: data.warnings || []
                  }));
              });

              newSocket.on('import_session_joined', (data) => {
                  console.log('🎯 Joined session:', data.sessionId);
                  setIsMonitoring(true);
              });

              newSocket.on('import_session_left', (data) => {
                  console.log('👋 Left session:', data.sessionId);
                  setIsMonitoring(false);
                  setCurrentSession(null);
              });

              newSocket.on('error', (error) => {
                  console.error('❌ Socket error:', error);
                  setConnectionError(error.message);
              });

              setSocket(newSocket);

              return () => {
                  if (newSocket) {
                      newSocket.disconnect();
                  }
              };
          }, [token]);

          // Handle file selection
          const handleFileSelect = (event) => {
              const file = event.target.files[0];
              if (file) {
                  setSelectedFile(file);
                  setUploadProgress(0);
              }
          };

          // Parse uploaded file
          const parseFile = async (file) => {
              const text = await file.text();

              if (file.name.endsWith('.json')) {
                  return JSON.parse(text);
              } else if (file.name.endsWith('.csv')) {
                  const lines = text.split('\n');
                  const headers = lines[0].split(',').map(h => h.trim());

                  return lines.slice(1)
                      .filter(line => line.trim())
                      .map(line => {
                          const values = line.split(',').map(v => v.trim());
                          const item = {};

                          headers.forEach((header, index) => {
                              item[header] = values[index];
                          });

                          return item;
                      });
              }

              throw new Error('Unsupported file format. Please use CSV or JSON.');
          };

          // Start batch upload with monitoring
          const startUpload = async () => {
              if (!selectedFile || !socket || !isConnected) {
                  return;
              }

              try {
                  setIsUploading(true);
                  setUploadProgress(0);

                  // Parse file
                  const items = await parseFile(selectedFile);
                  setUploadProgress(25);

                  // Start batch upload
                  const response = await fetch('/api/inventory/items/batch', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'Authorization': `Bearer ${token}`
                      },
                      body: JSON.stringify({ items })
                  });

                  setUploadProgress(75);

                  if (!response.ok) {
                      throw new Error(`Upload failed: ${response.statusText}`);
                  }

                  const result = await response.json();
                  setUploadProgress(100);

                  // Start monitoring
                  if (result.meta?.sessionId) {
                      setCurrentSession(result.meta.sessionId);
                      socket.emit('join_import_session', result.meta.sessionId);
                  }

              } catch (error) {
                  console.error('❌ Upload error:', error);
                  setConnectionError(error.message);
              } finally {
                  setIsUploading(false);
                  setTimeout(() => setUploadProgress(0), 2000);
              }
          };

          // Stop monitoring
          const stopMonitoring = () => {
              if (socket && currentSession) {
                  socket.emit('leave_import_session', currentSession);
              }
          };

          // Reset progress
          const resetProgress = () => {
              setProgress({
                  status: 'idle',
                  currentPhase: '',
                  progress: 0,
                  processedCount: 0,
                  successCount: 0,
                  errorCount: 0,
                  skipCount: 0,
                  itemCount: 0,
                  estimatedTimeRemaining: null,
                  errors: [],
                  warnings: [],
                  results: null
              });
              setSelectedFile(null);
              setCurrentSession(null);
              setConnectionError(null);
              if (fileInputRef.current) {
                  fileInputRef.current.value = '';
              }
          };

          // Format time remaining
          const formatTimeRemaining = (milliseconds) => {
              if (!milliseconds) return '--';

              const seconds = Math.round(milliseconds / 1000);
              const minutes = Math.floor(seconds / 60);
              const remainingSeconds = seconds % 60;

              if (minutes > 0) {
                  return `${minutes}m ${remainingSeconds}s`;
              }
              return `${seconds}s`;
          };

          // Get phase color
          const getPhaseColor = (phase) => {
              const colors = {
                  'validation': 'text-blue-600',
                  'duplicate_check': 'text-yellow-600',
                  'creation': 'text-green-600',
                  'completed': 'text-emerald-600'
              };
              return colors[phase] || 'text-gray-600';
          };

          // Get status badge
          const getStatusBadge = (status) => {
              const badges = {
                  'idle': 'bg-gray-100 text-gray-800',
                  'processing': 'bg-blue-100 text-blue-800',
                  'completed': 'bg-green-100 text-green-800',
                  'error': 'bg-red-100 text-red-800'
              };
              return badges[status] || 'bg-gray-100 text-gray-800';
          };

          return React.createElement('div', { className: "max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-lg" }, [
              // Header
              React.createElement('div', { className: "mb-6" }, [
                  React.createElement('h2', {
                      className: "text-2xl font-bold text-gray-900 mb-2"
                  }, "📦 Batch Inventory Import Monitor"),

                  React.createElement('div', { className: "flex items-center space-x-4" }, [
                      React.createElement('div', { className: "flex items-center" }, [
                          React.createElement('div', {
                              className: `w-3 h-3 rounded-full mr-2 ${
                                  isConnected ? 'bg-green-500' : 'bg-red-500'
                              }`
                          }),
                          React.createElement('span', {
                              className: "text-sm text-gray-600"
                          }, isConnected ? 'Connected' : 'Disconnected')
                      ]),

                      currentSession && React.createElement('div', {
                          className: "text-sm text-gray-600"
                      }, [
                          "Session: ",
                          React.createElement('span', {
                              className: "font-mono bg-gray-100 px-2 py-1 rounded"
                          }, currentSession.substring(0, 20) + "...")
                      ])
                  ])
              ]),

              // Connection Error
              connectionError && React.createElement('div', {
                  className: "mb-4 p-4 bg-red-50 border border-red-200 rounded-lg"
              }, [
                  React.createElement('div', { className: "flex items-center" }, [
                      React.createElement('svg', {
                          className: "w-5 h-5 text-red-500 mr-2",
                          fill: "currentColor",
                          viewBox: "0 0 20 20"
                      }, React.createElement('path', {
                          fillRule: "evenodd",
                          d: "M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z",
                          clipRule: "evenodd"
                      })),
                      React.createElement('span', {
                          className: "text-red-800"
                      }, connectionError)
                  ])
              ]),

              // File Upload Section
              !isMonitoring && React.createElement('div', {
                  className: "mb-6 p-6 border-2 border-dashed border-gray-300 rounded-lg hover:border-gray-400 transition-colors"
              }, [
                  React.createElement('div', { className: "text-center" }, [
                      React.createElement('svg', {
                          className: "mx-auto h-12 w-12 text-gray-400 mb-4",
                          fill: "none",
                          viewBox: "0 0 24 24",
                          stroke: "currentColor"
                      }, React.createElement('path', {
                          strokeLinecap: "round",
                          strokeLinejoin: "round",
                          strokeWidth: 2,
                          d: "M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                      })),

                      React.createElement('input', {
                          ref: fileInputRef,
                          type: "file",
                          accept: ".csv,.json",
                          onChange: handleFileSelect,
                          className: "hidden",
                          id: "file-upload"
                      }),

                      React.createElement('label', {
                          htmlFor: "file-upload",
                          className: "cursor-pointer inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                      }, "Select File"),

                      selectedFile && React.createElement('div', { className: "mt-4" }, [
                          React.createElement('p', { className: "text-sm text-gray-600" }, [
                              "Selected: ",
                              React.createElement('span', {
                                  className: "font-medium"
                              }, selectedFile.name)
                          ]),

                          // Upload Progress
                          isUploading && React.createElement('div', { className: "mt-2" }, [
                              React.createElement('div', {
                                  className: "flex justify-between text-sm text-gray-600 mb-1"
                              }, [
                                  React.createElement('span', null, "Uploading..."),
                                  React.createElement('span', null, uploadProgress + "%")
                              ]),
                              React.createElement('div', {
                                  className: "w-full bg-gray-200 rounded-full h-2"
                              }, React.createElement('div', {
                                  className: "bg-blue-600 h-2 rounded-full transition-all duration-300",
                                  style: { width: uploadProgress + "%" }
                              }))
                          ]),

                          React.createElement('button', {
                              onClick: startUpload,
                              disabled: isUploading || !isConnected,
                              className: "mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed"
                          }, isUploading ? [
                              React.createElement('svg', {
                                  className: "animate-spin -ml-1 mr-2 h-4 w-4 text-white",
                                  fill: "none",
                                  viewBox: "0 0 24 24"
                              }, [
                                  React.createElement('circle', {
                                      className: "opacity-25",
                                      cx: "12",
                                      cy: "12",
                                      r: "10",
                                      stroke: "currentColor",
                                      strokeWidth: "4"
                                  }),
                                  React.createElement('path', {
                                      className: "opacity-75",
                                      fill: "currentColor",
                                      d: "M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                  })
                              ]),
                              "Uploading..."
                          ]) : "Start Upload & Monitor")
                      ])
                  ])
              ]),

              // Progress Monitoring Section
              isMonitoring && React.createElement('div', { className: "space-y-6" }, [
                  // Status Header
                  React.createElement('div', { className: "flex items-center justify-between" }, [
                      React.createElement('div', { className: "flex items-center space-x-3" }, [
                          React.createElement('span', {
                              className: `inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${getStatusBadge(progress.status)}`
                          }, progress.status),
                          React.createElement('span', {
                              className: `text-sm font-medium ${getPhaseColor(progress.currentPhase)}`
                          }, (progress.currentPhase?.replace('_', ' ').toUpperCase() || 'INITIALIZING'))
                      ]),

                      React.createElement('button', {
                          onClick: stopMonitoring,
                          className: "text-sm text-red-600 hover:text-red-800 font-medium"
                      }, "Stop Monitoring")
                  ]),

                  // Progress Bar
                  React.createElement('div', null, [
                      React.createElement('div', {
                          className: "flex justify-between text-sm text-gray-600 mb-2"
                      }, [
                          React.createElement('span', null, "Overall Progress"),
                          React.createElement('span', null, progress.progress + "%")
                      ]),
                      React.createElement('div', {
                          className: "w-full bg-gray-200 rounded-full h-3"
                      }, React.createElement('div', {
                          className: "bg-gradient-to-r from-blue-500 to-green-500 h-3 rounded-full transition-all duration-500 ease-out",
                          style: { width: progress.progress + "%" }
                      }))
                  ]),

                  // Stats Grid
                  React.createElement('div', { className: "grid grid-cols-2 md:grid-cols-4 gap-4" }, [
                      React.createElement('div', { className: "bg-blue-50 p-4 rounded-lg" }, [
                          React.createElement('div', {
                              className: "text-2xl font-bold text-blue-600"
                          }, progress.processedCount),
                          React.createElement('div', {
                              className: "text-sm text-blue-800"
                          }, "Processed")
                      ]),
                      React.createElement('div', { className: "bg-green-50 p-4 rounded-lg" }, [
                          React.createElement('div', {
                              className: "text-2xl font-bold text-green-600"
                          }, progress.successCount),
                          React.createElement('div', {
                              className: "text-sm text-green-800"
                          }, "Created")
                      ]),
                      React.createElement('div', { className: "bg-yellow-50 p-4 rounded-lg" }, [
                          React.createElement('div', {
                              className: "text-2xl font-bold text-yellow-600"
                          }, progress.skipCount),
                          React.createElement('div', {
                              className: "text-sm text-yellow-800"
                          }, "Skipped")
                      ]),
                      React.createElement('div', { className: "bg-red-50 p-4 rounded-lg" }, [
                          React.createElement('div', {
                              className: "text-2xl font-bold text-red-600"
                          }, progress.errorCount),
                          React.createElement('div', {
                              className: "text-sm text-red-800"
                          }, "Errors")
                      ])
                  ]),

                  // Completion Message
                  progress.status === 'completed' && progress.results && React.createElement('div', {
                      className: "bg-green-50 border border-green-200 rounded-lg p-6"
                  }, [
                      React.createElement('div', { className: "flex items-center" }, [
                          React.createElement('svg', {
                              className: "w-8 h-8 text-green-500 mr-3",
                              fill: "currentColor",
                              viewBox: "0 0 20 20"
                          }, React.createElement('path', {
                              fillRule: "evenodd",
                              d: "M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z",
                              clipRule: "evenodd"
                          })),
                          React.createElement('div', null, [
                              React.createElement('h4', {
                                  className: "text-lg font-medium text-green-800"
                              }, "Import Completed Successfully!"),
                              React.createElement('div', {
                                  className: "mt-2 text-sm text-green-700"
                              }, [
                                  React.createElement('div', null, `Total items: ${progress.results.summary?.total || 0}`),
                                  React.createElement('div', null, `Created: ${progress.results.summary?.created || 0}`),
                                  React.createElement('div', null, `Skipped: ${progress.results.summary?.skipped || 0}`),
                                  React.createElement('div', null, `Errors: ${progress.results.summary?.errors || 0}`),
                                  React.createElement('div', null, `Total time: ${Math.round((progress.totalTime || 0) / 1000)}s`)
                              ])
                          ])
                      ]),

                      React.createElement('button', {
                          onClick: resetProgress,
                          className: "mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                      }, "Start New Import")
                  ])
              ])
          ]);
      };

      // Main App Component
      const App = () => {
          const [token, setToken] = useState(localStorage.getItem('jwt-token') || '');
          const [isLoggedIn, setIsLoggedIn] = useState(!!token);

          // Mock login function
          const handleLogin = async () => {
              try {
                  const response = await fetch('/api/auth/login', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                          email: 'admin@example.com',
                          password: 'password123'
                      })
                  });

                  const data = await response.json();

                  if (data.token) {
                      localStorage.setItem('jwt-token', data.token);
                      setToken(data.token);
                      setIsLoggedIn(true);
                  }
              } catch (error) {
                  console.error('Login failed:', error);
              }
          };

          // Handle logout
          const handleLogout = () => {
              localStorage.removeItem('jwt-token');
              setToken('');
              setIsLoggedIn(false);
          };

          return React.createElement('div', { className: "min-h-screen bg-gray-100" }, [
              // Header
              React.createElement('header', { className: "bg-white shadow-sm border-b border-gray-200" }, [
                  React.createElement('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" }, [
                      React.createElement('div', { className: "flex justify-between items-center h-16" }, [
                          React.createElement('div', { className: "flex items-center" }, [
                              React.createElement('h1', {
                                  className: "text-xl font-bold text-gray-900"
                              }, "🏨 EliteHub Inventory System")
                          ]),

                          React.createElement('div', { className: "flex items-center space-x-4" }, [
                              isLoggedIn ? [
                                  React.createElement('span', {
                                      className: "text-sm text-gray-600"
                                  }, "Welcome, Admin"),
                                  React.createElement('button', {
                                      onClick: handleLogout,
                                      className: "inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                                  }, "Logout")
                              ] : React.createElement('button', {
                                  onClick: handleLogin,
                                  className: "inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                              }, "Login")
                          ])
                      ])
                  ])
              ]),

              // Main Content
              React.createElement('main', { className: "max-w-7xl mx-auto py-6 sm:px-6 lg:px-8" }, [
                  React.createElement('div', { className: "px-4 py-6 sm:px-0" }, [
                      isLoggedIn ? [
                          React.createElement('div', { className: "space-y-6" }, [
                              // Page Title
                              React.createElement('div', { className: "bg-white shadow rounded-lg p-6" }, [
                                  React.createElement('h2', {
                                      className: "text-2xl font-bold text-gray-900 mb-2"
                                  }, "Inventory Management"),
                                  React.createElement('p', {
                                      className: "text-gray-600"
                                  }, "Upload and monitor bulk inventory imports in real-time using Socket.io")
                              ]),

                              // Batch Import Monitor
                              React.createElement(BatchImportMonitor, {
                                  token: token,
                                  onImportComplete: (results) => {
                                      console.log('Import completed:', results);
                                  }
                              })
                          ])
                      ] : React.createElement('div', {
                          className: "bg-white shadow rounded-lg p-8 text-center"
                      }, [
                          React.createElement('svg', {
                              className: "mx-auto h-12 w-12 text-gray-400 mb-4",
                              fill: "none",
                              viewBox: "0 0 24 24",
                              stroke: "currentColor"
                          }, React.createElement('path', {
                              strokeLinecap: "round",
                              strokeLinejoin: "round",
                              strokeWidth: 2,
                              d: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                          })),
                          React.createElement('h2', {
                              className: "text-2xl font-bold text-gray-900 mb-2"
                          }, "Authentication Required"),
                          React.createElement('p', {
                              className: "text-gray-600 mb-6"
                          }, "Please login to access inventory import monitoring system."),
                          React.createElement('button', {
                              onClick: handleLogin,
                              className: "inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                          }, "Login to Continue")
                      ])
                  ])
              ]),

              // Footer
              React.createElement('footer', { className: "bg-white border-t border-gray-200 mt-12" }, [
                  React.createElement('div', { className: "max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8" }, [
                      React.createElement('div', {
                          className: "text-center text-sm text-gray-500"
                      }, "© 2024 EliteHub Hotel Management System. Real-time Socket.io monitoring powered by React & Tailwind CSS.")
                  ])
              ])
          ]);
      };

      // Render the app
      ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
  </body>
</html>
